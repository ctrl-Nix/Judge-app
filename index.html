<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Judge — Aukaat Check AI</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Manrope:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- LANDING -->
<div id="landing">
  <div class="brand">Judge.</div>
  <p class="tagline">Hinglish Roast &nbsp;·&nbsp; No Mercy &nbsp;·&nbsp; No Advice</p>

  <div class="modes">
    <div class="mode-card" onclick="document.getElementById('file-input').click()">
      <h2>Roast my File</h2>
      <p>Upload resume, PDF, doc, code, notes. I will explain why it is embarrassing.</p>
      <input type="file" id="file-input" accept=".pdf,.txt,.md,.js,.py,.doc,.docx,image/*" onchange="handleFile(event)" />
    </div>
    <div class="mode-card" onclick="startChat()">
      <h2>Roast my Life</h2>
      <p>Just talk. Tell me about your day, your plans, your dreams. I will handle the rest.</p>
    </div>
  </div>
</div>

<!-- CHAT -->
<div id="chat-view">
  <div class="chat-header">
    <div class="header-left">
      <span class="chat-brand">Judge.</span>
      <div class="heartbeat" id="heartbeat">
        <span class="dot"></span>
        <span class="count">2,841</span> egos being dismantled
      </div>
    </div>
    <div class="header-right">
      <button class="reset-btn" onclick="toggleArchive()">Archive</button>
      <button class="reset-btn" onclick="startReset()">Reset</button>
    </div>
  </div>

  <div id="sidebar-archive">
    <div class="archive-header">
      <span>Sin Registry</span>
      <button onclick="toggleArchive()">&times;</button>
    </div>
    <div id="archive-list"></div>
  </div>
  <div id="messages"></div>
  <div class="input-area">
    <div class="input-inner">
      <button class="attach-btn" id="attach-btn" title="Attach file" onclick="document.getElementById('chat-file').click()">
        <input type="file" id="chat-file" style="display:none" accept=".pdf,.txt,.md,.js,.py,.doc,.docx,image/*" onchange="handleChatFile(event)" />
        &#x2B06;
      </button>
      <textarea id="user-input" rows="1" placeholder="Bol." onkeydown="checkEnter(event)" oninput="autoResize(this)"></textarea>
      <button class="send-btn" id="send-btn" onclick="sendMessage()">&#x2192;</button>
    </div>
    <span class="attach-label" id="attach-label"></span>
  </div>
</div>

<script src="js/script.js"></script>
</body>
</html>
